name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the beta prerelease

jobs:
  core-linux:
    name: DSP core (Linux, tests + sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build -j
          ctest --test-dir core/build --output-on-failure
          core/build/punch_bench
      - name: ASan/UBSan
        run: |
          cmake -S core -B core/build-asan -DPUNCH_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build core/build-asan -j
          ctest --test-dir core/build-asan --output-on-failure

  mac-app:
    name: The Bass Shaker.app (macOS)
    uses: ./.github/workflows/mac-app.yml
    with:
      runner: macos-26
    secrets: inherit

  # GitHub's Apple Silicon Macs sometimes run out ("job was not acquired …
  # capacity constraints") and the job is cancelled after ~15 min. Then build
  # the same universal app on an Intel Mac (same Xcode 26.6) so the beta still
  # ships. A run cancelled by hand before a runner picked it up also falls through.
  mac-app-fallback:
    name: The Bass Shaker.app (macOS, Intel fallback)
    needs: mac-app
    # "Not acquired" can surface as failure or cancelled, so fall back on
    # anything but success, but only if no runner ever started the job: a
    # build, test or launch-smoke-test failure on Apple Silicon must not ship
    # from Intel (an arm64-only crash would pass the Intel smoke test).
    if: ${{ always() && needs.mac-app.result != 'success' && needs.mac-app.result != 'skipped' && needs.mac-app.outputs.started != '1' }}
    uses: ./.github/workflows/mac-app.yml
    with:
      runner: macos-26-intel
    secrets: inherit
